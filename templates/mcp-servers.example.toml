# 放到 ~/.codex/config.toml 的示例片段（将 <PROJECT_ROOT> 替换为你的仓库绝对路径）

[mcp_servers.academic-data-hunter]
command = "python"
args = ["<PROJECT_ROOT>/scripts/mcp_server.py"]

[mcp_servers.tavily-proxy]
command = "npx"
args = ["-y", "mcp-remote", "https://<your-tavily-mcp-endpoint>/mcp", "--header", "Authorization: Bearer <TOKEN>"]

[mcp_servers.exa-proxy]
command = "npx"
args = ["-y", "mcp-remote", "https://<your-exa-mcp-endpoint>/mcp", "--header", "Authorization: Bearer <TOKEN>"]
