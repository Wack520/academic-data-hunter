name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            pyproject.toml

      - name: Validate lockfile target Python
        if: matrix.python-version == '3.11'
        run: grep -E -q "Python 3.11|python-version 3.11|--python 3.11" requirements-lock.txt

      - name: Check dependency declarations are synced
        run: python scripts/check_dependency_sync.py

      - name: Check docs command paths
        run: python scripts/check_docs_command_paths.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            pip install -r requirements-lock.txt
          else
            pip install -r requirements.txt
          fi
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Type check
        run: mypy tools/ --ignore-missing-imports

      - name: Compile check
        run: python -m compileall -q scripts tools cases

      - name: Run tests with coverage
        run: |
          python -m coverage run -m pytest -q tests/
          python -m coverage report --fail-under=80
